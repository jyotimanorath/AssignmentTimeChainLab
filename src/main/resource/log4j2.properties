#############################
#   Log4j2 Configuration
#############################

# Logging configuration name
name = Log4j2Config
status = error

# ----------------------------
# Console Appender
# ----------------------------
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# ----------------------------
# File Appender
# ----------------------------
appender.file.type = File
appender.file.name = FileLogger
# \u2705 Log file path (relative to project folder)
appender.file.fileName = logs/app.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# ----------------------------
# Application Logger
# ----------------------------
logger.app.name = com.timechainlab        # <-- replace with your base package name
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRefs = console, file
logger.app.appenderRef.console.ref = Console
logger.app.appenderRef.file.ref = FileLogger

# ----------------------------
# Root Logger
# ----------------------------
rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = FileLogger
